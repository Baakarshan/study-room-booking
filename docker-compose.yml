services:
  mysql:
    image: mysql:8.0
    container_name: seatflow-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: seatflow
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - seatflow-mysql-data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7-alpine
    container_name: seatflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - seatflow-redis-data:/data

volumes:
  seatflow-mysql-data:
  seatflow-redis-data:
